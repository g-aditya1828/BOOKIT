spring:
  datasource:
    url: jdbc:h2:mem:ticket_booking;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG

app:
  jwt-secret: ${JWT_SECRET:changeMeToASecureSecretKeyAtLeast32Chars}
  jwt-expiration-ms: 86400000