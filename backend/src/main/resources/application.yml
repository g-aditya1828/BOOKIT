spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:bookit;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:bookit-super-secret-key-must-be-at-least-32-chars-long!}
  expiration-ms: 86400000

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_1DP5mmOlF5G5ag}
  key-secret: ${RAZORPAY_KEY_SECRET:test_secret_for_bookit_dev}

logging:
  level:
    root: INFO
    com.example.ticketbooking: INFO
